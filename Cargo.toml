[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/cli",
    "crates/server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "net"
]}
tower = { version = "0.5.3", features = ["util"] }